[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "opencv-python-headless", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
